<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Budget App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>💰 Smart Budget App</h1>

    <h2>Balance: ₹<span id="balance">0</span></h2>

    <form id="form">
      <input type="text" id="text" placeholder="Enter description" required>

      <input type="number" id="amount" placeholder="Enter amount (+income, -expense)" required>

      <select id="category">
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Shopping">Shopping</option>
        <option value="Salary">Salary</option>
      </select>

      <button>Add</button>
    </form>

    <ul id="list"></ul>

    <canvas id="chart"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>

</body>
</html>
